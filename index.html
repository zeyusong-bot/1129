  :root{
    --ink:#0a0709; --pink:#ff6fa5; --pink-lt:#ffd6e6; --cream:#f7eedd;
    --txt:#f6eef2; --dim:#c9a8b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);overflow:hidden;
    font-family:"Q",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;overflow:hidden;touch-action:manipulation}

  section{position:absolute;inset:0;opacity:0;pointer-events:none;
    transition:opacity .62s cubic-bezier(.22,.9,.3,1), transform .62s cubic-bezier(.22,.9,.3,1);
    transform:translateY(2.2vh)}
  section.on{opacity:1;transform:none;pointer-events:auto}
  section.z{transform:translateY(-2.2vh)}

  /* ---------- 密码门 ---------- */
  #gate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4vh;padding:0 10vw}
  #gate h1{font-size:3.6vh;font-weight:600;letter-spacing:.06em;margin:0;color:#f3e6ec;text-align:center}
  #gate h1.ok{font-size:4.1vh;line-height:1.66;letter-spacing:.03em;color:#ffe2ee}
  #gate .field{width:100%;display:flex;flex-direction:column;align-items:center;gap:1.8vh}
  #ans{width:100%;max-width:64vw;background:transparent;border:none;border-bottom:1px solid rgba(255,214,230,.28);
    color:var(--pink-lt);font-size:3.1vh;text-align:center;padding:1.2vh 0;outline:none;
    font-family:inherit;letter-spacing:.05em;caret-color:var(--pink)}
  #ans::placeholder{color:rgba(255,214,230,.26);font-size:2.4vh}
  #go{background:transparent;border:1px solid rgba(255,214,230,.30);color:#f0d3df;
    font-family:inherit;font-size:2.2vh;padding:1.2vh 7vw;border-radius:99px;
    letter-spacing:.3em;margin-top:.6vh}
  #go:active{background:rgba(255,111,165,.16)}
  #hint{min-height:3.2vh;font-size:2.2vh;color:rgba(255,214,230,.34);letter-spacing:.04em;
    transition:color .4s ease;text-align:center}
  #hint.warn{color:#ff9dc1}

  /* ---------- 通用文字 ---------- */
  .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:2.4vh;padding:0 6vw;text-align:center}
  .l1{font-size:3.5vh;font-weight:700;letter-spacing:.02em;margin:0}
  /* 逐字出场 */
  .ch{display:inline-block;opacity:0;will-change:transform,opacity;
      animation:chIn .62s cubic-bezier(.2,.85,.3,1) forwards}
  @keyframes chIn{from{opacity:0;transform:translateY(.5em) scale(.96)}
                  to{opacity:1;transform:none}}
  .tp{opacity:1!important;transform:none!important;transition:none!important}
  .l2{font-size:2.42vh;line-height:1.8;color:var(--dim);margin:0}

  /* ---------- 粉色标题卡 ---------- */
  .card{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
        padding-left:10vw;gap:2.6vh;background:var(--pink);overflow:hidden}
  .card .echo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:22vh;font-weight:900;letter-spacing:.2em;color:rgba(10,7,9,.032);
    white-space:nowrap;pointer-events:none;user-select:none}
  .card .t1{font-size:4.3vh;font-weight:600;color:#1a0d13;letter-spacing:.06em}
  .card .rule{width:30vw;height:2px;background:rgba(10,7,9,.85)}
  .card .t2{font-size:min(10.2vh,19.5vw);font-weight:900;color:#0a0709;letter-spacing:.05em;
    line-height:1;display:flex;gap:.01em}
  .card .t2 span{display:inline-block}
  .card .cnt{position:absolute;right:6vw;bottom:7vh;font-size:1.7vh;letter-spacing:.34em;
    color:rgba(10,7,9,.55);font-weight:600}
  .card.cream{background:#f4e6cf}
  #s3 .t2{font-size:min(9.6vh,17vw)}

  /* ---------- 开场 ---------- */
  #s1{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:0 9vw}
  #s1 p{font-size:3.0vh;line-height:1.9;margin:0;letter-spacing:.03em;opacity:0;
        transform:translateY(12px);transition:opacity .9s ease,transform .9s ease}
  #s1 p.in{opacity:1;transform:none}
  #s1 .dim{color:#b98fa3}

  /* ---------- 粉色格子 ---------- */
  #s2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:0 6vw}
  #grid{display:grid;grid-template-columns:repeat(9,1fr);gap:1.1vw;width:100%}
  #grid i{aspect-ratio:1;border-radius:.6vw;background:#ff6fa5;opacity:.14;transition:opacity .5s ease,transform .5s ease}
  #grid i.lit{opacity:1;transform:scale(1.35);box-shadow:0 0 3vw rgba(255,111,165,.9)}

  /* ---------- 奶茶 ---------- */
  #s4{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:0 6vw}
  #s4 img{max-width:78vw;max-height:46vh;display:block}
  .pearl{position:absolute;width:1.5vh;height:1.5vh;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#6b4030,#2a150f);opacity:.9;
    animation:hop 1.5s infinite ease-in-out}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2vh)}}

  /* ---------- 小素龙 ---------- */
  #s5{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:0 6vw}
  #s5 img{max-width:84vw;max-height:50vh;display:block;
    filter:drop-shadow(0 0 8vh rgba(255,111,165,.2))}

  /* ---------- 收束 ---------- */
  #s6{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:0 10vw}
  #s6 p{font-size:3.3vh;line-height:1.85;margin:0;letter-spacing:.05em;text-align:center}

  /* ---------- 蛋糕 ---------- */
  /* 6.5 素龙的篮子：五张表情包堆出来 */
  #s6b{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
       padding-top:7vh;gap:0}
  #bwrap{position:relative;display:inline-block;line-height:0}
  #bimg{display:block;width:84vw;max-width:430px;height:auto;max-height:52vh;
        object-fit:contain;filter:drop-shadow(0 0 6vh rgba(255,111,165,.16))}
  #bwrap.tap{animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
  .pop{position:absolute;left:50%;top:50%;z-index:1;width:23vw;max-width:112px;aspect-ratio:1;
       transform:translate(-50%,-50%) scale(.14);opacity:0;pointer-events:none;
       border-radius:1.1vh;background:#fffdf8;box-shadow:0 1.4vh 4vh rgba(0,0,0,.62);
       display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pop img{width:100%;height:100%;object-fit:contain;display:block}
  .pop .ph{font-family:Q,inherit;font-size:4.4vh;color:#c9a3b4;opacity:.85}
  #bcue{margin-top:2.4vh;font-size:2.15vh;letter-spacing:.24em;color:rgba(255,255,255,.46);
        opacity:0;transition:opacity .5s ease}
  #bcue.on{opacity:1}
  #bline{position:absolute;left:0;right:0;bottom:13vh;padding:0 8vw;text-align:center;z-index:6;
         font-size:2.55vh;line-height:1.62;color:#ffd6e6;opacity:0;
         transition:opacity .32s ease;text-shadow:0 0 4vh rgba(0,0,0,.7)}
  #bline.on{opacity:1}
  #bfin{position:absolute;left:0;right:0;bottom:12vh;padding:0 8vw;text-align:center;z-index:6;
        font-size:3.3vh;line-height:1.7;color:#fff;opacity:0;
        text-shadow:0 0 6vh rgba(255,111,165,.45)}
  #bfin.on{opacity:1}
  #bfin .k{color:var(--pink)}
  #s6b.dim .pop[data-i="3"], #s6b.dim .pop[data-i="4"]{opacity:.42;filter:blur(1.2px)}

  /* ---------- 6a 端蛋糕 / 6b 点蜡烛 ---------- */
  #s8{display:flex;flex-direction:column;align-items:center;justify-content:center}
  #s8 .bgdragon{position:absolute;left:50%;bottom:1vh;width:96vw;transform:translateX(-50%);
    opacity:0;filter:blur(1.8px) brightness(.66) saturate(.95);transition:opacity 1.2s ease}
  #s8.up .bgdragon{opacity:1}

  .cakeBox{position:relative;width:var(--cw,46vw);height:var(--ch,21vh);z-index:2}
  .cakeBox .plate{position:absolute;left:-1%;right:-1%;bottom:-1.9vh;height:2.2vh;
    background:radial-gradient(ellipse at 50% 26%,#fff8fb,#c9a2b1 60%,#6b4a55);
    border:.28vh solid #2b0a16;border-radius:50%;
    box-shadow:0 2.2vh 4vh rgba(0,0,0,.75)}
  .cakeBox .body{position:absolute;left:3%;right:3%;bottom:0;height:72%;
    background:
      linear-gradient(90deg,rgba(80,10,40,.34) 0%,rgba(80,10,40,0) 16%,
                      rgba(80,10,40,0) 84%,rgba(80,10,40,.34) 100%),
      linear-gradient(#ffe1ec 0%,#ff9dc0 42%,#d95a92 100%);
    border:.42vh solid #2b0a16;border-radius:1.4vh 1.4vh 2.2vh 2.2vh;
    box-shadow:inset 0 -2.4vh 3vh rgba(120,20,60,.42)}
  .cakeBox .top{position:absolute;left:-1%;right:-1%;top:11%;height:19%;z-index:3;
    background:radial-gradient(ellipse at 50% 30%,#fffdf6,#f4e6cf 68%,#e2c9a9);
    border:.42vh solid #2b0a16;border-radius:50% 50% 46% 46%}
  .cakeBox .drip{position:absolute;left:-1%;right:-1%;top:22%;height:12%;z-index:4;
    background:radial-gradient(ellipse at 50% 0%,#fffdf6,#f6e8d2 82%,rgba(246,232,210,0) 100%);
    border-radius:0 0 48% 48%/0 0 100% 100%}
  .cakeBox .drops{position:absolute;left:5%;right:5%;top:24%;z-index:5;
    display:flex;justify-content:space-between;align-items:flex-start}
  .cakeBox .drops i{display:block;background:linear-gradient(#fdf3e2,#f6e7cf);
    border-radius:0 0 50% 50%;filter:drop-shadow(0 .34vh 0 rgba(43,10,22,.45))}
  .cakeBox .drops i:nth-child(1){width:1.5vh;height:2.4vh}
  .cakeBox .drops i:nth-child(2){width:1.5vh;height:3.6vh}
  .cakeBox .drops i:nth-child(3){width:1.5vh;height:2.1vh}
  .cakeBox .drops i:nth-child(4){width:1.5vh;height:3.9vh}
  .cakeBox .drops i:nth-child(5){width:1.5vh;height:2.6vh}
  .cakeBox .drops i:nth-child(6){width:1.5vh;height:3.2vh}
  .cakeBox .candle{position:absolute;bottom:57%;width:2.2vh;height:8.4vh;z-index:6;
    border:.3vh solid #2b0a16;border-radius:.5vh;
    background:repeating-linear-gradient(0deg,#fffdf6 0,#fffdf6 1.1vh,#ff7fa8 1.1vh,#ff7fa8 1.9vh);
    transition:transform .2s ease}
  .cakeBox .candle.lit{transform:scale(1)}
  .cakeBox .candle .wick{position:absolute;left:50%;top:-.85vh;width:.22vh;height:1vh;
    background:#3a1020;transform:translateX(-50%)}
  .cakeBox .flame{position:absolute;left:50%;top:-4.1vh;width:2vh;height:4vh;
    transform:translateX(-50%) scale(.2);border-radius:50% 50% 46% 46%;opacity:0;
    background:radial-gradient(ellipse at 50% 74%,#fffce6 0%,#ffe06a 40%,#ff8a1e 72%,rgba(255,110,0,0) 100%);
    filter:blur(.2px);transition:opacity .45s ease,transform .5s cubic-bezier(.2,1.6,.4,1);
    box-shadow:0 0 3.4vh rgba(255,180,60,.8)}
  .cakeBox .flame.on{opacity:1;transform:translateX(-50%) scale(1);animation:flick .26s infinite alternate}
  @keyframes flick{from{transform:translateX(-50%) scale(1) rotate(-3deg)}to{transform:translateX(-50%) scale(1.09) rotate(3deg)}}

  /* 6b：素龙端着（虚化），蛋糕升起，四字在上，蜡烛她点 */
  #s8 .cakeBox{--cw:64vw;--ch:27vh;margin-top:4vh;
    transform:translateY(6vh) scale(.9);opacity:0;
    transition:transform 1.4s cubic-bezier(.22,.9,.3,1),opacity 1s ease .1s}
  #s8.up .cakeBox{transform:none;opacity:1}
  #s8 .chars{display:flex;gap:1.6vw;margin-bottom:1.4vh}
  #s8 .chars b{font-size:min(8.6vh,17vw);font-weight:900;letter-spacing:.02em;color:#fff;
    opacity:0;transform:translateY(2vh) scale(1.08);filter:blur(6px);
    transition:opacity .5s ease,transform .5s cubic-bezier(.22,.9,.3,1),filter .5s ease;
    text-shadow:0 0 5vh rgba(255,111,165,.5)}
  #s8 .chars b.on{opacity:1;transform:none;filter:none}
  #wish{position:absolute;left:50%;bottom:15vh;transform:translateX(-50%);width:38vw;height:.55vh;
    background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden;opacity:0;
    transition:opacity .5s ease;z-index:9}
  #wish.on{opacity:1}
  #wish i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6fa5,#ffd6e6);
    border-radius:99px}

  /* ---------- 落版 ---------- */
  #s9{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;padding:0 8vw}
  #big{font-size:min(9.4vh,17vw);font-weight:900;letter-spacing:.10em;line-height:1.05;
    text-align:center;color:#fff;text-shadow:0 0 8vh rgba(255,111,165,.5);margin:0;
    white-space:nowrap;padding-left:.10em}
  #s9 .who{font-size:3vh;color:var(--pink-lt);letter-spacing:.3em;margin:0}
  #s9 .fin{font-size:2.3vh;color:#b98fa3;margin:0;letter-spacing:.08em}
  #again{margin-top:3vh;background:rgba(255,111,165,.12);border:1px solid rgba(255,214,230,.46);
    color:#ffd9e6;font-family:inherit;font-size:2.1vh;padding:1.3vh 6vw;border-radius:99px;
    letter-spacing:.18em;opacity:0;transition:opacity .8s ease}
  #again.on{opacity:1}
  #egg{position:fixed;left:0;right:0;bottom:22vh;text-align:center;font-size:2.2vh;
    color:#ff9dc1;opacity:0;transition:opacity .5s ease;pointer-events:none;z-index:20}
  #egg.on{opacity:1}

  /* ---------- HUD ---------- */
  #dots{position:absolute;right:4.6vw;top:calc(3.4vh + env(safe-area-inset-top));
    display:flex;gap:1.7vw;z-index:12;opacity:0;transition:opacity .5s ease}
  #dots.on{opacity:1}
  #dots i{width:1.1vh;height:1.1vh;border-radius:50%;background:rgba(255,255,255,.22);display:block;
    transition:background .4s ease,box-shadow .4s ease}
  #dots i.on{background:var(--pink);box-shadow:0 0 1.4vh rgba(255,111,165,.85)}
  #tap{position:absolute;left:0;right:0;bottom:calc(3.4vh + env(safe-area-inset-bottom));
    text-align:center;font-size:1.9vh;letter-spacing:.5em;color:rgba(255,255,255,.40);
    opacity:0;transition:opacity .5s ease;z-index:12;pointer-events:none}
  #tap.on{opacity:.95}
  #bezel{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.55) 100%)}
  #ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:15;
    background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,0) 70%);
    opacity:0;transform:translate(-50%,-50%) scale(.2)}
</style>
</head>
<body>
<div id="stage">

  <!-- 0 密码门 -->
  <section id="gate" class="on">
    <h1>今天是几月几号？</h1>
    <div class="field">
      <input id="ans" inputmode="numeric" autocomplete="off">
      <button id="go">进 去</button>
      <div id="hint">月份点日期，像 3.7 这样</div>
    </div>
  </section>

  <!-- 1 开场 -->
  <section id="s1">
    <p>别人送礼物。</p>
    <p>我写了个网页。</p>
    <p class="dim">因为我想让它<br>只属于小王同学一个人。</p>
  </section>

  <!-- 2 粉色标题卡 -->
  <section id="s2" class="card">
    <div class="echo">Pink</div>
    <div class="t1">我研究了一下</div>
    <div class="rule"></div>
    <div class="t2"><span>粉</span><span>色</span></div>
    <div class="cnt">0 2 / 0 7</div>
  </section>

  <!-- 3 粉色格子 -->
  <section id="s3">
    <div class="mid" style="gap:4vh;padding:0 6vw">
      <div id="grid"></div>
      <p class="l2">发现粉有两百多种。<br>我挑了最不像 Hello Kitty 的那种。</p>
    </div>
  </section>

  <!-- 4 奶茶 -->
  <section id="s4">
    <div id="shakeWrap" style="position:relative">
      <img src="assets/web/milktea.webp" alt="">
    </div>
    <p class="l1">我研究了一下奶茶。</p>
    <p class="l2">珍珠是圆的，好动，<br>所以我让它一直在杯子里跳。</p>
  </section>

  <!-- 5 小素龙 -->
  <section id="s5">
    <img src="assets/web/s6.webp" alt="">
    <p class="l1">我研究了一下小素龙。</p>
    <p class="l2">现在变成了<br>一个不能动的粉色小土豆。</p>
  </section>

  <!-- 6 收束 -->
  <section id="s6">
    <p>但你喜欢什么，<br>这件事我没搞错。</p>
  </section>

  <!-- 6.5 素龙的篮子 -->
    <section id="s6b">
      <div id="bwrap"><img id="bimg" src="assets/web/s3.webp" alt=""></div>
      <p id="bcue">点 一 下 篮 子</p>
      <p id="bline"></p>
      <p id="bfin">不开玩笑啦，<br><span class="k">后面就是惊喜。</span></p>
    </section>

    <!-- 7 端蛋糕 -->
  <!-- 8 点蜡烛：她点一根，亮一根，出来一个字 -->
  <section id="s8">
    <img class="bgdragon" src="assets/web/s5.webp" alt="">
    <div class="chars"><b>生</b><b>日</b><b>快</b><b>乐</b></div>
    <div class="cakeBox">
      <div class="plate"></div>
      <div class="body"></div>
      <div class="top"></div>
      <div class="drip"></div>
      <div class="drops"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="candle" data-i="0" style="left:17%"><div class="wick"></div><div class="flame"></div></div>
      <div class="candle" data-i="1" style="left:39%"><div class="wick"></div><div class="flame"></div></div>
      <div class="candle" data-i="2" style="left:61%"><div class="wick"></div><div class="flame"></div></div>
      <div class="candle" data-i="3" style="left:83%"><div class="wick"></div><div class="flame"></div></div>
    </div>
    <div id="wish"><i></i></div>
  </section>

  <!-- 9 落版 -->
  <section id="s9">
    <div id="big">生日快乐</div>
    <p class="who">小王同学</p>
    <p class="fin">技术有限，心意没有。</p>
    <button id="again">再看一遍</button>
  </section>

  <div id="dots"></div>
  <div id="tap">轻 点 继 续</div>
  <div id="bezel"></div>
  <div id="ripple"></div>
  <div id="egg">（小素龙：我已经很努力了）</div>
</div>

<script>
(function(){
  window.onerror = function(m, src, line){
    document.title = 'ERR: ' + m;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#300;color:#f9a;font:11px/1.5 monospace;padding:8px;white-space:pre-wrap';
    d.textContent = m + '  @line ' + line;
    document.body.appendChild(d);
  };
  // ====== 配置：她的生日（月 / 日）======
  const BIRTH = { m: 11, d: 29 };
// 主曲从第几秒开始播：原曲 0-1.5s 是静音、2s 才起伴奏、约 9s 人声进
const MAIN_START = 2.0;
  const TOTAL_STEPS = 7;

  // ======================================================================
  //  改文案：篮子里那五张表情包，点出来时底部说的五句话
  //  只改单引号中间的汉字，别动引号、逗号、行尾的句号；一句别超过 14 个字
  // ======================================================================
  const POP_LINE = [
    'GG Bond 不可爱嘛？',
    '这张很有严肃的味道。',
    '这张是仰慕小王同学的样子。',
    '这张是被小王同学逗乐的。',
    '这张是我在静观其变。'
  ];
  // ======================================================================

  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const stage = $('#stage'), dots = $('#dots'), tapcue = $('#tap');
  const clamp01 = x => x<0?0:x>1?1:x;

  // ====== 音乐 ======
  const A = {
    main:  new Audio('assets/audio/main_a.mp3'),
    piano: new Audio('assets/audio/piano_hbd.mp3'),
    vox:   new Audio('assets/audio/vox.mp3'),
    end:   new Audio('assets/audio/main_b.mp3')
  };
  Object.values(A).forEach(a=>{ a.preload='auto'; });
  A.main.volume = 0.9; A.piano.volume = 0.0; A.vox.volume = 0.95; A.end.volume = 0.0;
  function play(el){ const p = el.play(); if(p&&p.catch) p.catch(()=>{}); }
  function fade(el, from, to, ms){
    const t0 = performance.now();
    const step = t => {
      const k = clamp01((t-t0)/ms);
      el.volume = Math.max(0, Math.min(1, from + (to-from)*k));
      if(k<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ====== 粉色格子 ======
  (function buildGrid(){
    const g = document.getElementById('grid');
    if(!g) return;
    for(let i=0;i<81;i++){ g.appendChild(document.createElement('i')); }
  })();

  // ====== 进度点 ======
  for(let i=0;i<TOTAL_STEPS;i++){ const d=document.createElement('i'); if(i===0) d.className='on'; dots.appendChild(d); }
  function setDots(n){ $$('#dots i').forEach((d,i)=>d.classList.toggle('on', i<=n)); }

  // ====== 场景机 ======
  const ORDER = ['gate','s1','s2','s3','s4','s5','s6','s6b','s8','s9'];
  let at = 0;          // 当前场景索引
  let locked = true;   // 门上锁时不响应点击
  let timers = [];
  function clearTimers(){ timers.forEach(id=>clearTimeout(id)); timers=[]; }
  function later(fn, ms){ const id=setTimeout(fn, ms); timers.push(id); return id; }

  function show(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.add('on');
    el.classList.remove('z');
  }
  function hide(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.remove('on');
    el.classList.add('z');
  }
  function go(idx){
    const prev = ORDER[at], next = ORDER[idx];
    // 进四字屏时，蛋糕要留在画面上（不清 s7）
    if(prev!==next && !(next==='s8' && prev==='s7')) hide(prev);
    at = idx;
    show(next);
    onEnter(next);
  }

  // ====== 逐字出场 ======
  function splitChars(root, counter, step, base){
    Array.from(root.childNodes).forEach(function(nd){
      if(nd.nodeType === 3){
        const frag = document.createDocumentFragment();
        for(const ch of nd.nodeValue){
          if(ch === '\n') continue;
          const sp = document.createElement('span');
          sp.className = 'ch';
          sp.textContent = (ch === ' ') ? '\u00a0' : ch;
          sp.style.animationDelay = (base + counter.i * step).toFixed(3) + 's';
          counter.i++;
          frag.appendChild(sp);
        }
        nd.parentNode.replaceChild(frag, nd);
      } else if(nd.nodeType === 1 && nd.tagName !== 'BR'){
        splitChars(nd, counter, step, base);
      }
    });
  }
  const CH_DUR = 0.62;   // 单个字的淡入时长，和 CSS 里 @keyframes chIn 保持一致
  function typeIn(el, base, step){
    if(!el) return 0;
    if(el.dataset.html === undefined){ el.dataset.html = el.innerHTML; }
    else if(el.dataset.html !== ''){ el.innerHTML = el.dataset.html; }
    el.classList.add('tp');
    const b  = (base == null ? 0 : base);
    const st = (step == null ? 0.10 : step);
    const c  = {i:0};
    splitChars(el, c, st, b);
    // 最后一个字的起始时刻 + 它自己的淡入时长
    return b + Math.max(0, c.i - 1) * st + CH_DUR;
  }

  // ====== 每屏进入时做什么 ======
  function onEnter(id){
    clearTimers();
    tapcue.classList.remove('on');
    dots.classList.toggle('on', id!=='gate');

    if(id==='gate'){
      locked = true;
      var q = $('#gate h1');
      q.classList.remove('ok');
      if(q.dataset.html === ''){ q.dataset.html = undefined; }
      typeIn(q, 0.65, 0.135);
      setTimeout(()=>$('#ans').focus(), 900);
      return;
    }

    if(id==='s1'){
      locked = true;
      var ps = $$('#s1 p');
      const S1T = [0.60, 3.10, 5.60];
      ps.forEach((p,i)=>later(function(){
        p.classList.add('in');
        var f = typeIn(p, 0, 0.185);
        if(i === ps.length - 1){
          later(()=>{ locked=false; tapcue.classList.add('on'); }, (f + 0.35) * 1000);
        }
      }, S1T[i]*1000));
    }

    if(id==='s2'){
      locked = true;
      var f2a = typeIn($('#s2 .t1'), 0.50, 0.190);
      var t2 = $$('#s2 .t2 span');
      t2.forEach((s,i)=>{ s.style.opacity=0; s.style.transform='translateY(14px)';
        later(()=>{ s.style.transition='opacity .6s ease, transform .6s cubic-bezier(.22,.9,.3,1)';
                    s.style.opacity=1; s.style.transform='none'; }, 420 + i*180); });
      later(()=>{ locked=false; tapcue.classList.add('on'); }, Math.max(f2a, 1.40) * 1000 + 300);
      setDots(1);
    }

    if(id==='s3'){
      locked = true;
      var cells = $$('#grid i');
      cells.forEach(c=>c.classList.remove('lit'));
      gridPaint(false);
      later(()=>gridPaint(true), 1500);
      var f3 = typeIn($('#s3 .l2'), 1.25, 0.130);
      later(()=>{ locked=false; tapcue.classList.add('on'); }, Math.max(f3, 1.9) * 1000 + 300);
      setDots(1);
    }

    if(id==='s4'){
      locked = true;
      spawnPearls();
      var f4a = typeIn($('#s4 .l1'), 0.50, 0.185);
      var f4b = typeIn($('#s4 .l2'), 2.00, 0.120);
      later(()=>{ locked=false; tapcue.classList.add('on'); }, Math.max(f4a, f4b) * 1000 + 300);
      setDots(2);
    }

    if(id==='s5'){
      locked = true;
      var f5a = typeIn($('#s5 .l1'), 0.50, 0.185);
      var f5b = typeIn($('#s5 .l2'), 2.10, 0.135);
      later(()=>{ locked=false; tapcue.classList.add('on'); }, Math.max(f5a, f5b) * 1000 + 300);
      setDots(3);
    }

    if(id==='s6'){
      locked = true;
      var f6 = typeIn($('#s6 p'), 0.60, 0.165);
      later(()=>{ locked=false; tapcue.classList.add('on'); }, f6 * 1000 + 350);
      setDots(4);
    }

    if(id==='s6b'){
      locked = false;               // 这一屏的点击不开新屏，是开箱
      tapcue.classList.remove('on');
      resetBasket();
      setDots(4);
      var dbgPop = parseInt(new URLSearchParams(location.search).get('pop') || '0', 10);
      if(dbgPop > 0){
        for(var i=0;i<Math.min(dbgPop,5);i++){ placePop(i); }
        pops = Math.min(dbgPop,5);
        $('#bcue').classList.remove('on');
        $('#bwrap').classList.remove('tap');
        $('#bline').textContent = POP_LINE[pops-1];
        $('#bline').classList.add('on');
        if(pops >= 5){ $('#bline').classList.remove('on'); $('#bfin').classList.add('on'); }
      }
      later(idleTick, 6500);
      if(new URLSearchParams(location.search).get('simtap')){ later(()=>popOne(), 900); }
    }

    if(id==='s8'){
      // 6b：素龙端着（虚化），蛋糕升起；四根蜡烛她自己点，一笔一笔把"生日快乐"点出来
      blown = false;
      locked = true;
      lit = 0;
      songOn = false;
      tapcue.classList.remove('on');
      $$('#s8 .flame').forEach(f=>f.classList.remove('on'));
      $$('#s8 .candle').forEach(c=>c.classList.remove('lit'));
      $$('#s8 .chars b').forEach(b=>b.classList.remove('on'));
      $('#wish').classList.remove('on');
      $('#wish i').style.transition = 'none';
      $('#wish i').style.width = '0%';
      $('#s8').classList.remove('up');
      setTimeout(()=>$('#s8').classList.add('up'), 120);
      later(()=>{ if(ORDER[at]==='s8') cue('点 蜡 烛'); }, 1500);
      setDots(5);
      // 她一直不点：28 秒后自己点完，别卡死
      later(()=>{ if(ORDER[at]==='s8' && lit < 4){ lightAll(); } }, 28000);
    }

    if(id==='s9'){
      // 落版：先收起蛋糕和四字
      hide('s7'); hide('s8');
      locked = false;
      tapcue.classList.remove('on');
      A.main.pause(); A.piano.pause(); A.vox.pause();
      A.end.currentTime = 0; A.end.volume = 0.0; play(A.end); fade(A.end, 0, 0.85, 1800);
      typeIn($('#s9 .who'), 0.55, 0.230);
      var f9 = typeIn($('#s9 .fin'), 2.20, 0.140);
      later(()=>{ const b=$('#again'); b.classList.add('on'); b.style.opacity='1'; }, f9 * 1000 + 500);
      setDots(6);
    }
  }

  // 6c：吹蜡烛（单独插在 s8 之后）
  let blown = false;
  function blowScene(){
    if(blown) return;
    blown = true;
    clearTimers();
    tapcue.classList.remove('on');
    cancelHold();
    $('#wish').classList.remove('on');
    songOn = false;
    fade(A.piano, A.piano.volume, 0, 240);
    later(()=>{ A.piano.pause(); }, 300);
    $$('.flame').forEach((f,i)=>later(()=>f.classList.remove('on'), i*85));
    later(()=>{ A.vox.currentTime = 0; A.vox.volume = 0.95; play(A.vox); }, 90);
    // 人声 13 秒，必须放完才进落版；放完自动跳，兜底 14.2 秒
    A.vox.onended = ()=>{ go(ORDER.indexOf('s9')); };
    later(()=>{ if(ORDER[at] !== 's9') go(ORDER.indexOf('s9')); }, 14200);
  }

  // ====== 素龙的篮子：一张一点 ======
  const POP_SPOT = [[21,18,-7],[63,11,5],[83,37,9],[18,56,-6],[61,65,6]];   // 整屏百分比
  const POP_SRC = ['assets/web/m1.webp','assets/web/m2.webp','assets/web/m3.webp',
                   'assets/web/m4.webp','assets/web/m5.webp'];
  let pops = 0, lastTapAt = 0, basketBuilt = false;

  function buildBasket(){
    if(basketBuilt) return;
    basketBuilt = true;
    const host = $('#s6b');
    for(let i=0;i<5;i++){
      const d = document.createElement('div');
      d.className = 'pop';
      d.dataset.i = i;
      var im = document.createElement('img');
      im.src = POP_SRC[i];
      im.alt = '';
      d.appendChild(im);
      host.appendChild(d);
    }
  }

  // 篮口在屏幕上的百分比位置（运行时按图片实际盒子算，79%/63% 是从素材上量出来的）
  function basketAnchor(){
    const img = $('#bimg'), sec = $('#s6b');
    if(!img || !sec) return [50, 50];
    const r = img.getBoundingClientRect(), sr = sec.getBoundingClientRect();
    if(!sr.width || !sr.height) return [50, 50];
    return [ (r.left - sr.left + r.width * 0.79) / sr.width * 100,
             (r.top  - sr.top  + r.height * 0.63) / sr.height * 100 ];
  }

  function resetBasket(){
    buildBasket();
    pops = 0;
    lastTapAt = Date.now();
    const an = basketAnchor();
    $$('#s6b .pop').forEach(p=>{
      p.getAnimations().forEach(a=>a.cancel());
      p.style.opacity = '0';
      p.style.left = an[0] + '%';
      p.style.top  = an[1] + '%';
      p.style.transform = 'translate(-50%,-50%) scale(.14)';
    });
    $('#bline').classList.remove('on');
    $('#bline').textContent = '';
    $('#bfin').classList.remove('on');
    $('#s6b').classList.remove('dim');
    $('#bcue').classList.add('on');
    $('#bwrap').classList.add('tap');
  }

  function placePop(i){
    const el = $$('#s6b .pop')[i], sp = POP_SPOT[i];
    el.style.opacity='1';
    el.style.left = sp[0]+'%'; el.style.top = sp[1]+'%';
    el.style.transform = 'translate(-50%,-50%) scale(1) rotate('+sp[2]+'deg)';
  }

  function popOne(){
    if(pops >= 5) return false;
    const i = pops;
    const el = $$('#s6b .pop')[i];
    const sp = POP_SPOT[i];
    const an = basketAnchor();
    $('#bwrap').classList.remove('tap');
    $('#bcue').classList.remove('on');
    el.style.opacity = '1';
    const a = el.animate([
      {left: an[0]+'%', top: an[1]+'%', transform:'translate(-50%,-50%) scale(.14) rotate(0deg)', opacity:0},
      {left: sp[0]+'%', top: sp[1]+'%', transform:'translate(-50%,-50%) scale(1.14) rotate('+sp[2]+'deg)', opacity:1, offset:.74},
      {left: sp[0]+'%', top: sp[1]+'%', transform:'translate(-50%,-50%) scale(1) rotate('+sp[2]+'deg)',    opacity:1}
    ], {duration:560, easing:'cubic-bezier(.18,1.18,.32,1)', fill:'forwards'});
    a.onfinish = ()=>{ el.style.left = sp[0]+'%'; el.style.top = sp[1]+'%'; };
    later(()=>{ placePop(i); }, 700);   // 兜底：动画万一没跑完，也让它落在终点
    pops++;
    lastTapAt = Date.now();
    const line = $('#bline');
    line.classList.remove('on');
    later(()=>{ line.textContent = POP_LINE[i]; line.classList.add('on'); }, 260);
    if(pops >= 5){
      later(()=>{
        $('#bline').classList.remove('on');
        $('#s6b').classList.add('dim');
        $('#bfin').classList.add('on');
        later(()=>{ if(ORDER[at]==='s6b') advance(true); }, 3000);
      }, 2600);
    }
    return true;
  }

  function idleTick(){
    if(ORDER[at] !== 's6b') return;
    if(pops >= 5) return;
    if(Date.now() - lastTapAt > 6500){ popOne(); }
    later(idleTick, 1200);
  }

  // ====== 粉色格子：上色 / 点亮 ======
  const GRID_PICK = 37;
  function gridPaint(light){
    const cells = $$('#grid i');
    cells.forEach((c,i)=>{
      c.style.background = 'hsl(' + (332 + (i % 13) * 1.4).toFixed(1) + ',86%,' + (56 + (i % 7) * 2.2).toFixed(1) + '%)';
      c.style.opacity = (i===GRID_PICK && light) ? '1'
                        : (0.15 + 0.07*Math.abs(Math.sin(i*1.7))).toFixed(2);
    });
    if(light) cells[GRID_PICK].classList.add('lit');
    else cells[GRID_PICK].classList.remove('lit');
  }

  // ====== 奶茶珍珠 ======
  function spawnPearls(){
    const wrap = $('#shakeWrap');
    wrap.querySelectorAll('.pearl').forEach(p=>p.remove());
    const spots = [[44,62],[52,70],[60,58],[48,78],[56,84]];
    spots.forEach((s,i)=>{
      const d = document.createElement('div');
      d.className='pearl';
      d.style.left = s[0]+'%'; d.style.top = s[1]+'%';
      d.style.animationDelay = (i*0.18)+'s';
      d.style.animationDuration = (1.3 + i*0.12)+'s';
      wrap.appendChild(d);
    });
  }

  // ====== 推进 ======
  // ====== 6b 蛋糕：她点一根，亮一根，出一个字 ======
  let lit = 0, songOn = false;
  const NOTE_AT = [0.40, 0.81, 1.62, 2.46];   // 钢琴实测：生/日/快/乐 四个起音
  function cue(t){ tapcue.textContent = t; tapcue.classList.add('on'); }

  function noteAt(i){
    try{
      const np = new Audio(A.piano.src);
      np.volume = 0.9;
      np.currentTime = NOTE_AT[i];
      play(np);
      later(()=>{ try{ np.pause(); }catch(_){} }, 820);
    }catch(_){}
  }

  function lightCandle(el){
    if(!el || el.classList.contains('lit')) return;
    const i = parseInt(el.dataset.i, 10);
    el.classList.add('lit');
    const fl = el.querySelector('.flame');
    if(fl) fl.classList.add('on');
    const b = $$('#s8 .chars b')[i];
    if(b) b.classList.add('on');
    noteAt(i);
    lit++;
    if(lit >= 4) startSong();
  }

  function lightAll(){ $$('#s8 .candle').forEach(el=>lightCandle(el)); }

  function startSong(){
    if(songOn) return;
    songOn = true;
    tapcue.classList.remove('on');
    try{ A.piano.currentTime = 2.86; A.piano.volume = 0; play(A.piano); fade(A.piano, 0, 0.95, 600); }catch(_){}
    $('#wish').classList.add('on');
    later(()=>{ if(ORDER[at]==='s8') cue('按 住 许 愿'); }, 700);
  }

  let holdTimer = null, holding = false;
  function startHold(){
    if(holding || lit < 4) return;
    holding = true;
    const bar = $('#wish i');
    bar.style.transition = 'width 1.5s linear';
    bar.style.width = '100%';
    holdTimer = setTimeout(()=>{ holding = false; blowScene(); }, 1500);
  }
  function cancelHold(){
    if(!holding) return;
    holding = false;
    clearTimeout(holdTimer);
    const bar = $('#wish i');
    bar.style.transition = 'width .25s ease';
    bar.style.width = '0%';
  }

  function advance(auto){
    if(!auto && locked) return;
    const cur = ORDER[at];
    if(cur==='s6b'){ if(pops < 5){ popOne(); return; } }   // 五张没出完就继续掏；出完了才往下走
    if(cur==='s8'){ blowScene(); return; }
    const idx = ORDER.indexOf(cur);
    if(idx < 0) return;
    if(cur==='s9') return;
    go(idx+1);
  }

  // ====== 点击 ======
  function ripple(x,y){
    const r = $('#ripple');
    r.style.left=x+'px'; r.style.top=y+'px';
    r.style.width='16vmin'; r.style.height='16vmin';
    r.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:.8},
               {transform:'translate(-50%,-50%) scale(1)',opacity:0}],
              {duration:520,easing:'cubic-bezier(.22,.9,.3,1)'});
  }
  stage.addEventListener('pointerdown', e=>{
    if(e.target.closest('#ans') || e.target.closest('#again')) return;
    if(ORDER[at]==='s8'){
      const cd = e.target.closest('#s8 .candle');
      if(cd && lit < 4){
        ripple(e.clientX, e.clientY);
        if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(_){} }
        lightCandle(cd);
        return;
      }
      if(lit >= 4){ startHold(); return; }
      return;
    }
    ripple(e.clientX, e.clientY);
    if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(_){} }
    advance(false);
  });
  ['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t, cancelHold, {passive:true}));

  // ====== 密码门 ======
  function norm(s){
    return s.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-65248));
  }
  function parseMD(raw){
    const s = norm(raw).trim();
    if(!s) return null;
    // 去掉年份
    let digits = s.replace(/[^0-9]/g,'');
    if(digits.length>=8){ digits = digits.slice(4); }
    if(digits.length===4){ return { m:+digits.slice(0,2), d:+digits.slice(2) }; }
    if(digits.length===3){ return { m:+digits[0], d:+digits.slice(1) }; }
    const nums = (s.match(/\d+/g)||[]).map(Number);
    if(nums.length>=3){ return { m: nums[1], d: nums[2] }; }
    if(nums.length===2){ return { m: nums[0], d: nums[1] }; }
    return null;
  }
  let tries = 0;
  const hint = $('#hint');
  function say(t){ hint.textContent = t; hint.classList.toggle('warn', !!t); }

  let unlocked = false;
  function unlock(){
    if(unlocked) return;
    unlocked = true;
    locked = true;
    const gate = $('#gate');
    const h1 = gate.querySelector('h1');
    h1.classList.add('ok');
    h1.dataset.html = '';
    h1.innerHTML = '答对啦，<br>但今天好像不太一样';
    typeIn(h1, 0.18, 0.230);
    $('#ans').style.display='none';
    const field = gate.querySelector('.field');
    if(field){ field.style.display='none'; }
    say('');
    // 第一次手势已经发生 → 可以播音乐
    A.piano.pause(); A.vox.pause(); A.end.pause();
    A.main.currentTime = MAIN_START; A.main.volume = 0.85; play(A.main);
    later(()=>{ go(ORDER.indexOf('s1')); }, 4600);
  }

  function tryUnlock(){
    const got = parseMD($('#ans').value);
    if(got && ((got.m===BIRTH.m && got.d===BIRTH.d) || (got.m===BIRTH.d && got.d===BIRTH.m))){ unlock(); return; }
    tries++;
    if(tries===1) say('不对，是你生日那天。');
    else if(tries===2) say('提示：每年都要过的那天。');
    else { say('算了，进来吧。'); later(unlock, 900); }
  }
  $('#ans').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  $('#go').addEventListener('click', tryUnlock);

  // ====== 彩蛋：连点大字三下 ======
  let taps=0, tapTimer=null;
  $('#big').addEventListener('pointerdown', ()=>{
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(()=>taps=0, 900);
    if(taps>=3){ $('#egg').classList.add('on'); taps=0;
      setTimeout(()=>$('#egg').classList.remove('on'), 2600); }
  });

  // 6c：吹灭改成「按住许愿」（见 startHold / blowScene）

  // ====== 再看一遍 ======
  $('#again').addEventListener('click', ()=>{
    clearTimers();
    Object.values(A).forEach(a=>{ a.pause(); a.currentTime=0; });
    $('#egg').classList.remove('on');
    $('#again').classList.remove('on');
    $('#s8').classList.remove('up');
    $$('.flame').forEach(f=>f.classList.remove('on'));
    $$('#s8 .candle').forEach(c=>c.classList.remove('lit'));
    $$('#s8 .chars b').forEach(b=>b.classList.remove('on'));
    $('#wish').classList.remove('on');
    $('#wish i').style.width = '0%';
    lit = 0; songOn = false;
    tapcue.textContent = '轻 点 继 续';
    $$('#s1 p').forEach(p=>p.classList.remove('in'));
    hide(ORDER[at]); at=0; show('gate');
    $('#ans').style.display='';
    $('#ans').value=''; tries=0; say('');
    var gh=$('#gate').querySelector('h1'); gh.classList.remove('ok'); gh.dataset.html=''; gh.textContent='今天是几月几号？';
    locked = true;
    setDots(0);
    dots.classList.remove('on');
    setTimeout(()=>$('#ans').focus(), 400);
  });

  // ====== 静音兜底：iOS 需要用户手势 ======
  document.addEventListener('touchstart', function once(){
    document.removeEventListener('touchstart', once);
  }, {passive:true});

  // ====== 调试：?scene=s7 直接跳到某屏（截图用）======
  const dbg = new URLSearchParams(location.search).get('scene');
  if(dbg && ORDER.indexOf(dbg)>=0){
    document.getElementById('gate').classList.remove('on');
    at = ORDER.indexOf(dbg);
    show(dbg); onEnter(dbg);
    if(dbg==='s3'){ gridPaint(true); }
    if(dbg==='s8'){
      const n = parseInt(new URLSearchParams(location.search).get('lit') || '0', 10);
      if(n > 0){ for(var k=0;k<Math.min(n,4);k++){ lightCandle($$('#s8 .candle')[k]); } }
    }
  }

  // ====== 自测：?auto=1 自动走完全片（不点，用来看有没有卡死）======
  if(new URLSearchParams(location.search).get('auto')){
    setTimeout(()=>{ go(ORDER.indexOf('s1')); }, 300);
    let step = 0;
    const timer = setInterval(()=>{
      step++;
      document.title = 'AT=' + ORDER[at] + ' step=' + step;
      if(ORDER[at]==='s9'){ clearInterval(timer); return; }
      advance(true);
    }, 1600);
  }

  setDots(0);
})();
</script>
</body>
</html>
